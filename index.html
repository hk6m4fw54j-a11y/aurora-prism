<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>极光棱 Aurora Prism | 效果器与音箱</title>
    <style>
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('bg.png');
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            background-repeat: no-repeat;
            color: #ffffff;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh; 
        }
        .logo { width: 150px; height: auto; margin-bottom: 20px; }
        h1 {
            font-size: 3em;
            margin: 0 0 10px 0;
            background: linear-gradient(90deg, #00ff88, #ff0055);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        .slogan { font-size: 1.1em; color: #e0e0e0; margin-bottom: 50px; letter-spacing: 4px; }
        .products-container { display: flex; gap: 30px; max-width: 900px; width: 100%; justify-content: center; flex-wrap: wrap; }

        /* ⭐ 新增：让整个卡片变成可点击的链接，并去掉默认下划线 */
        .card-link {
            text-decoration: none;
            color: inherit;
            flex: 1;
            min-width: 250px;
            display: flex; /* 保证链接撑满卡片高度 */
        }

        .product-card {
            background-color: rgba(20, 20, 20, 0.3); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 16px; 
            padding: 40px 30px;
            width: 100%; /* 撑满父级链接 */
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); 
        }
        .product-card:hover {
            background-color: rgba(20, 20, 20, 0.5);
            border-color: rgba(0, 255, 136, 0.5);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
            transform: translateY(-5px);
        }
        .product-img { width: 120px; height: auto; margin-bottom: 20px; border-radius: 10px; }
        .product-card h2 { color: #fff; margin-top: 0; font-size: 1.8em; }
        .product-card p { color: #ddd; line-height: 1.6; font-size: 0.95em; text-align: left; }
        .tag {
            display: inline-block; background: #00ff88; color: #000;
            padding: 5px 12px; border-radius: 20px;
            font-size: 0.8em; font-weight: bold; margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="Aurora Prism Logo" class="logo">
    <h1>极光棱 Aurora Prism</h1>
    <div class="slogan">重塑声音的维度</div>

    <div class="products-container">
        
        <!-- ⭐ 修改点：用 <a> 标签包裹整个卡片，并指向新页面 pedal.html -->
        <a href=" " class="card-link">
            <div class="product-card">
                <div class="tag">即将发布</div>
                <img src="pedal.png" alt="光棱效果器" class="product-img">
                <h2>光棱系列效果器</h2>
                <p>拒绝千篇一律的平庸音色！棱角分明的赛博外观，突破传统的失真与调制音色。自定义你的专属音色，踩下它，让你的演奏瞬间炸翻全场。</p >
            </div>
        </a >

        <!-- ⭐ 修改点：用 <a> 标签包裹整个卡片，并指向新页面 speaker.html -->
        <a href="speaker.html" class="card-link">
            <div class="product-card">
                <div class="tag">研发中</div>
                <img src="speaker.png" alt="极光声学音箱" class="product-img">
                <h2>极光声学音箱</h2>
                <p>克制的极简美学，隐藏着不容小觑的声学能量。采用独特的结构设计，为你呈现干净、通透且极具沉浸感的纯粹之声。</p >
            </div>
        </a >

    </div>

</body>
</html>
