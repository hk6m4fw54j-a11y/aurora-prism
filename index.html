<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>极光棱 Aurora Prism | 效果器与音箱</title>
    <style>
        body {
            /* 这里已经把背景换成了你的 bg.png，并加了一层暗色遮罩保证文字清晰 */
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('bg.png');
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            background-repeat: no-repeat;
            
            color: #ffffff;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh; 
        }
        .logo {
            width: 150px;
            height: auto;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 3em;
            margin: 0 0 10px 0;
            background: linear-gradient(90deg, #00ff88, #ff0055);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        .slogan {
            font-size: 1.1em;
            color: #e0e0e0; 
            margin-bottom: 50px;
            letter-spacing: 4px;
        }
        .products-container {
            display: flex;
            gap: 30px;
            max-width: 900px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .product-card {
            /* 卡片半透明，在背景图上更显高级 */
            background-color: rgba(17, 17, 17, 0.8);
            backdrop-filter: blur(5px);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 40px 30px;
            flex: 1;
            min-width: 250px;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .product-card:hover {
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
            transform: translateY(-5px);
        }
        .product-img {
            width: 120px;
            height: auto;
            margin-bottom: 20px;
            border-radius: 10px;
        }
        .product-card h2 {
            color: #fff;
            margin-top: 0;
            font-size: 1.8em;
        }
        .product-card p {
            color: #bbb;
            line-height: 1.6;
            font-size: 0.95em;
        }
        .tag {
            display: inline-block;
            background: #00ff88;
            color: #000;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="Aurora Prism Logo" class="logo">

    <h1>极光棱 Aurora Prism</h1>
    <div class="slogan">重塑声音的维度</div>

    <div class="products-container">
        <div class="product-card">
            <div class="tag">即将发布</div>
            <img src="pedal.png" alt="光棱效果器" class="product-img">
            <h2>光棱系列效果器</h2>
            <p>拒绝千篇一律的平庸音色！棱角分明的赛博外观，突破传统的失真与调制音色，自定义你的专属失真与调制。踩下它，让你的演奏瞬间炸翻全场。</p>
        </div>

        <div class="product-card">
            <div class="tag">研发中</div>
            <img src="speaker.png" alt="极光声学音箱" class="product-img">
            <h2>极光声学音箱</h2>
            <p>克制的极简美学，隐藏着不容小觑的声学能量。采用独特的结构设计，为你呈现干净、通透且极具沉浸感的纯粹之声。</p>
        </div>
    </div>

</body>
</html>
